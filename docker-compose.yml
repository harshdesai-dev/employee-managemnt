services:
  postgres:
    image: postgres:16-alpine
    container_name: peopleos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: peopleos
      POSTGRES_USER: peopleos
      POSTGRES_PASSWORD: peopleos_dev_password
    ports: ["5432:5432"]
    volumes: ["peopleos_pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U peopleos -d peopleos"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  peopleos_pgdata:
