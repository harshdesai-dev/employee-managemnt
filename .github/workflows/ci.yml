name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev
      - name: Run server and client tests
        run: npm test
      - name: Build frontend
        run: npm run build
      - name: Build production API image
        run: docker build -f server/Dockerfile .
      - name: Build production frontend image
        run: docker build -f client/Dockerfile .
      - name: Validate production Compose configuration
        env:
          DATABASE_URL: postgresql://peopleos:ci-only-password@db.example.invalid:5432/peopleos
          DB_SSL: "true"
          SESSION_SECRET: ci-only-session-secret-with-at-least-32-characters
          CLIENT_ORIGINS: https://peopleos.example.com
          ADMIN_EMAIL: admin@example.com
          ADMIN_PASSWORD: Ci-Only-Strong-Password-123!
        run: docker compose -f docker-compose.production.yml config --quiet
